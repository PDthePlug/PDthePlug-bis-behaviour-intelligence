name: BIS CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "release/**"
  pull_request:
    branches:
      - main

concurrency:
  group: bis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://bis-ci.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_not_a_credential
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Release verification contract
        run: npm run verify

      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance
          path: |
            playwright-report/
            test-results/
